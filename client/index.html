<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Campo - Inteligência Artificial</title>
</head>

<body>

    <h1>Pesquisa de Campo sobre Inteligência Artificial</h1>

    <h2>Cadastrar uso de IA</h2>

    <form id="formulario">

        <label>Sistema:</label>
        <input type="text" id="sistema" required>
        <br><br>

        <label>Tipo:</label>
        <select id="tipo" required>
            <option value="">Selecione</option>
            <option value="empresa">Empresa</option>
            <option value="escola">Escola</option>
            <option value="pessoa">Pessoa</option>
        </select>
        <br><br>

        <label>Finalidade:</label>
        <input type="text" id="finalidade" required>
        <br><br>

        <label>Tecnologia:</label>
        <input type="text" id="tecnologia" required>
        <br><br>

        <label>Nível de risco:</label>
        <select id="nivel_risco" required>
            <option value="">Selecione</option>
            <option value="Baixo">Baixo</option>
            <option value="Médio">Médio</option>
            <option value="Alto">Alto</option>
        </select>
        <br><br>

        <label>
            <input type="checkbox" id="possui_revisao_humana">
            Possui revisão humana
        </label>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <p id="mensagem"></p>

    <script>
        let formulario = document.getElementById('formulario')
        let mensagem = document.getElementById('mensagem')

        formulario.addEventListener('submit', async function(event) {

            event.preventDefault()

            let dados = {
                sistema: document.getElementById('sistema').value,
                tipo: document.getElementById('tipo').value,
                finalidade: document.getElementById('finalidade').value,
                tecnologia: document.getElementById('tecnologia').value,
                nivel_risco: document.getElementById('nivel_risco').value,
                possui_revisao_humana: document.getElementById('possui_revisao_humana').checked
            }

            let resposta = await fetch('/usos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            })

            if (resposta.ok) {
                mensagem.textContent = 'Uso de IA cadastrado com sucesso!'
                formulario.reset()
            } else {
                mensagem.textContent = 'Erro ao cadastrar.'
            }
        })
    </script>
<footer><h2>by carolllx</h2></footer>
</body>

</html>
